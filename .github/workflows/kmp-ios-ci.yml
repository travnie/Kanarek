name: KMP iOS CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "gradle/**"
      - "gradle.properties"
      - "*.gradle.kts"
      - ".github/scripts/gradle-version.sh"
      - ".github/workflows/kmp-ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "shared/**"
      - "gradle/**"
      - "gradle.properties"
      - "*.gradle.kts"
      - ".github/scripts/gradle-version.sh"
      - ".github/workflows/kmp-ios-ci.yml"

concurrency:
  group: kmp-ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Read the Gradle version from the wrapper properties
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Test shared iOS target
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
