name: Rolling release

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/scripts/gradle-version.sh"
      - ".github/scripts/stage-benches.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: kanarek-rolling-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench-assets:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Stage verified portable Benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js for bundled Benches
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Build and verify pinned Bench assets without signing secrets
        run: bash .github/scripts/stage-benches.sh
      - name: Upload verified Bench assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-benches
          path: app/src/main/assets/benches/
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: bench-assets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve app version
        id: release
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::app/build.gradle.kts must declare a semantic version."
            exit 1
          fi
          if ! printf '%s\n' "$version_code" | grep -Eq '^[0-9]+$'; then
            echo "::error::app/build.gradle.kts must declare a numeric versionCode."
            exit 1
          fi
          {
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Download verified Bench assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-benches
          path: app/src/main/assets/benches/

      - name: Verify Bench artifact integrity before signing
        run: (cd app/src/main/assets/benches && sha256sum -c SHA256SUMS)

      - name: Read the Gradle version from the wrapper properties
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
          cache-disabled: true

      - name: Generate Gradle wrapper
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon

      - name: Validate release tree
        run: ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is not configured."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/play/release/app-play-release.apk dist/kanarek.apk
          cp app/build/outputs/apk/foss/release/app-foss-release.apk dist/kanarek-foss.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="kanarek-latest"

          cat > release-notes.md <<EOF
          Signed Android builds from \`${GITHUB_SHA}\`.

          Rolling release. Assets are replaced after each successful build of \`main\`.
          App version: \`${RELEASE_VERSION}\`.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" \
              -F force=true
            gh release edit "$tag" \
              --title "Kanarek · rolling" \
              --notes-file release-notes.md
          else
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Kanarek · rolling" \
              --notes-file release-notes.md
          fi

          gh release upload "$tag" \
            dist/kanarek.apk \
            dist/kanarek-foss.apk \
            --clobber
          gh release edit "$tag" --draft=false --latest
