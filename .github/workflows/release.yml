name: Rolling release

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-assets:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Stage verified portable Benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js for bundled Benches
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Build and verify pinned Bench assets without signing secrets
        run: bash .github/scripts/stage-benches.sh
      - name: Upload verified Bench assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-benches
          path: app/src/main/assets/benches/
          if-no-files-found: error
          retention-days: 30

  release:
    # Automatic caller waits for successful build and smoke in the same run.
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_call' ||
       (github.event_name == 'workflow_dispatch' && needs.bench-assets.result == 'success'))
    needs: bench-assets
    concurrency:
      group: kanarek-rolling-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve app version
        id: release
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::app/build.gradle.kts must declare a semantic version."
            exit 1
          fi
          if ! printf '%s\n' "$version_code" | grep -Eq '^[0-9]+$'; then
            echo "::error::app/build.gradle.kts must declare a numeric versionCode."
            exit 1
          fi
          {
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download verified Bench assets from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-benches
          path: app/src/main/assets/benches/

      - name: Verify Bench artifact integrity before signing
        run: (cd app/src/main/assets/benches && sha256sum -c SHA256SUMS)

      - name: Read the Gradle version from the wrapper properties
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
          cache-disabled: true

      - name: Generate Gradle wrapper
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon

      - name: Validate manually dispatched release tree
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is not configured."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/play/release/app-play-release.apk dist/kanarek.apk
          cp app/build/outputs/apk/foss/release/app-foss-release.apk dist/kanarek-foss.apk

      - name: Back up current rolling release
        id: backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=kanarek-latest
          backup_dir="$RUNNER_TEMP/kanarek-rolling-backup"
          lookup_err="$RUNNER_TEMP/rolling-backup.err"
          mkdir -p "$backup_dir"
          if old_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id 2>"$lookup_err")"; then
            old_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)"
            gh release download "$tag" --dir "$backup_dir" --pattern 'kanarek.apk' --pattern 'kanarek-foss.apk'
            test -s "$backup_dir/kanarek.apk"
            test -s "$backup_dir/kanarek-foss.apk"
            gh api "repos/$GH_REPO/releases/$old_id" > "$backup_dir/release.json"
            printf '%s\n' "$old_sha" > "$backup_dir/sha"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' "$lookup_err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$lookup_err" >&2
            exit 1
          fi

      - name: Preserve last good rolling release
        if: steps.backup.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rolling-release-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kanarek-rolling-backup/
          retention-days: 7
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="kanarek-latest"
          # Do not publish a superseded release tree, even if no public release exists.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$BUILT_SHA" FETCH_HEAD ||
            ! git diff --quiet "$BUILT_SHA" FETCH_HEAD -- app/ shared/ build.gradle.kts settings.gradle.kts gradle.properties gradle/ \
              .github/scripts/gradle-version.sh .github/scripts/stage-benches.sh .github/workflows/release.yml; then
            echo "::warning::Candidate differs from current main release inputs; keeping last-good release."
            exit 0
          fi
          # An orphan ref alone is not proof of published APKs. The backup step
          # confirmed and preserved the actual public release, if any.
          lookup_err="$RUNNER_TEMP/rolling-ref-lookup.err"
          if [ -s "$RUNNER_TEMP/kanarek-rolling-backup/release.json" ]; then
            old_sha="$(cat "$RUNNER_TEMP/kanarek-rolling-backup/sha")"
            git cat-file -e "$old_sha^{commit}" || git fetch --no-tags origin "$old_sha"
            if [ "$old_sha" != "$BUILT_SHA" ] && git merge-base --is-ancestor "$BUILT_SHA" "$old_sha"; then
              echo "A newer commit is already published; skipping stale release."
              exit 0
            fi
            git merge-base --is-ancestor "$old_sha" "$BUILT_SHA" || {
              echo "::error::Rolling tag is not an ancestor of the verified build."
              exit 1
            }
          fi

          stage="kanarek-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_id=""
          old_id=""
          old_ref_sha=""
          old_deleted=false
          backup_dir="$RUNNER_TEMP/kanarek-rolling-backup"
          old_notes="$RUNNER_TEMP/kanarek-rolling-notes.md"
          old_name="Kanarek · rolling"
          old_prerelease=false

          release_id_for_tag() {
            local wanted="$1" attempt output
            for attempt in 1 2 3; do
              if output="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$wanted\") | .id" 2>&1)" \
                && [ -n "$output" ]; then
                printf '%s\n' "$output"
                return 0
              fi
              [ "$attempt" -eq 3 ] || sleep "$attempt"
            done
            printf '%s\n' "$output" >&2
            return 1
          }

          is_absent() {
            local path="$1" err="$RUNNER_TEMP/rolling-absence.err"
            if gh api "$path" >/dev/null 2>"$err"; then
              return 1
            fi
            grep -q 'HTTP 404' "$err"
          }

          wait_for_absent_release_and_tag() {
            local wanted="$1" deadline
            deadline=$((SECONDS + 60))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if is_absent "repos/$GH_REPO/releases/tags/$wanted" &&
                is_absent "repos/$GH_REPO/git/ref/tags/$wanted"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          cleanup_failed_promotion() {
            local status=$? restored_sha
            trap - EXIT INT TERM
            set +e
            [ "$status" -ne 0 ] || return 0
            echo "::warning::Promotion failed; attempting rollback."

            # If old deletion was attempted but did not succeed, leave the old release alone.
            if [ "$old_deleted" = true ] && ! is_absent "repos/$GH_REPO/releases/$old_id"; then
              echo "::warning::Old release deletion not confirmed; preserving staged release and backup."
              exit "$status"
            fi

            if [ -n "$release_id" ]; then
              if ! gh api --method DELETE "repos/$GH_REPO/releases/$release_id" >/dev/null 2>&1 &&
                ! is_absent "repos/$GH_REPO/releases/$release_id"; then
                echo "::error::Could not remove staged release; backup retained."
                exit "$status"
              fi
            elif staged_id="$(release_id_for_tag "$stage")" && [ -n "$staged_id" ]; then
              gh api --method DELETE "repos/$GH_REPO/releases/$staged_id" >/dev/null 2>&1 || true
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$stage" >/dev/null 2>&1 || true

            if [ "$old_deleted" = true ]; then
              # Reuse the original ref if tag deletion failed; otherwise restore it explicitly.
              if restored_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>"$lookup_err")"; then
                if [ "$restored_sha" != "$old_ref_sha" ]; then
                  gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
                    -f sha="$old_ref_sha" -F force=true >/dev/null || exit "$status"
                fi
              elif grep -q 'HTTP 404' "$lookup_err"; then
                gh api --method POST "repos/$GH_REPO/git/refs" \
                  -f ref="refs/tags/$tag" -f sha="$old_ref_sha" >/dev/null || exit "$status"
              else
                echo "::error::Cannot verify rolling tag; backup retained."
                exit "$status"
              fi
              restore_args=(
                "$tag" "$backup_dir/kanarek.apk" "$backup_dir/kanarek-foss.apk"
                --verify-tag --title "$old_name" --notes-file "$old_notes" --latest
              )
              if [ "$old_prerelease" = true ]; then restore_args+=(--prerelease); fi
              if ! gh release create "${restore_args[@]}"; then
                echo "::error::Rollback failed. Previous APKs and metadata: rolling-release-backup artifact."
              fi
            fi
            exit "$status"
          }
          trap cleanup_failed_promotion EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          cat > release-notes.md <<EOF
          Signed Android builds from \`$BUILT_SHA\`.

          Rolling release. Assets are replaced after each successful build of \`main\`.
          App version: \`$RELEASE_VERSION\`.

          Published-commit: $BUILT_SHA
          EOF

          gh release create "$stage" dist/kanarek.apk dist/kanarek-foss.apk \
            --draft --target "$BUILT_SHA" \
            --title "Kanarek · rolling" --notes-file release-notes.md
          release_id="$(release_id_for_tag "$stage")"
          if [ -z "$release_id" ]; then
            echo "::error::Could not resolve the staged draft release."
            exit 1
          fi

          asset_count="$(gh api "repos/$GH_REPO/releases/$release_id/assets" --jq 'length')"
          test "$asset_count" -eq 2

          # Only a 404 means "absent"; any other failure must not look like a missing release.
          lookup_err="$RUNNER_TEMP/rolling-lookup.err"
          if old_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .id 2>"$lookup_err")"; then
            if ! old_ref_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
              echo "::error::Existing rolling release has no matching git tag."
              exit 1
            fi

            # The durable backup must match the exact release about to be replaced.
            test "$(jq -r .id "$backup_dir/release.json")" = "$old_id"
            test "$(cat "$backup_dir/sha")" = "$old_ref_sha"
            jq -r '.body // ""' "$backup_dir/release.json" > "$old_notes"
            old_name="$(jq -r '.name // "Kanarek · rolling"' "$backup_dir/release.json")"
            old_prerelease="$(jq -r .prerelease "$backup_dir/release.json")"

            old_deleted=true
            gh api --method DELETE "repos/$GH_REPO/releases/$old_id"
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag"
            if ! wait_for_absent_release_and_tag "$tag"; then
              echo "::error::Previous rolling release or tag did not disappear within 60 seconds."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$lookup_err"; then
            cat "$lookup_err" >&2
            echo "::error::Could not look up the published rolling release."
            exit 1
          fi

          # Leftover drafts from earlier failed promotions still claim the tag name, which blocks the
          # PATCH below; the staged release carries a different tag name, so it is never matched.
          stale_ids="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id")"
          for stale_id in $stale_ids; do
            echo "::warning::Deleting stale draft release $stale_id for $tag."
            gh api --method DELETE "repos/$GH_REPO/releases/$stale_id"
          done

          # A tag with no published release (e.g. only a draft holds the name) would stay on its old
          # commit: promoting a release onto an existing tag reuses it and ignores target_commitish.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>"$lookup_err"; then
            echo "::warning::Removing orphaned tag $tag; no published release owns it."
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag"
            if ! wait_for_absent_release_and_tag "$tag"; then
              echo "::error::Orphaned rolling tag did not disappear within 60 seconds."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$lookup_err"; then
            cat "$lookup_err" >&2
            echo "::error::Could not look up the rolling tag."
            exit 1
          fi

          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$tag" -f target_commitish="$BUILT_SHA" \
            -f name='Kanarek · rolling' -F draft=false -F prerelease=false \
            -f make_latest=true >/dev/null

          tag_synced=false
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if promoted_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)" \
              && [ "$promoted_sha" = "$BUILT_SHA" ]; then
              tag_synced=true
              break
            fi
            sleep 2
          done
          if [ "$tag_synced" != true ]; then
            echo "::error::Promoted rolling tag did not resolve to $BUILT_SHA within 60 seconds."
            exit 1
          fi

          final_asset_count="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets | length')"
          test "$final_asset_count" -eq 2
          trap - EXIT INT TERM
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$stage" >/dev/null 2>&1 || true
