name: Android CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore: ["worker/**", "docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["worker/**", "docs/**", "**/*.md"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Read the Gradle version from the wrapper properties
        id: gradle
        run: .github/scripts/gradle-version.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Generate Gradle wrapper if missing
        # Only gradle-wrapper.properties is tracked; the jar and the gradlew scripts are
        # regenerated so no prebuilt binary lives in the repository. F-Droid does the same
        # thing on its side, which is why leaving them out is deliberate.
        # Via env, not ${{ }} interpolation: the value comes out of a repository file, and on
        # a pull_request from a fork that file is attacker-controlled. The charset in the
        # regex above already rejects shell metacharacters; this makes the step safe even if
        # that regex is later loosened.
        env:
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

      - name: Build, test & lint
        # Flavor-qualified tasks: with product flavors (play/foss) AGP no longer creates
        # plain testDebugUnitTest/lintDebug. Unit tests and lint run on play (superset of
        # sources); fossDebug is assembled too so a GMS reference leaking into main/foss
        # sources fails CI immediately. Shared common tests run on the Android host target.
        run: ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest :shared:testAndroidHostTest lintPlayDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kanarek-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn


  # Two jobs, and the split is the whole point: the graph is resolved by *running the
  # project's own build logic*, so a pull request branch must never do that with a
  # write-capable token. Same-repository PRs do not get their permissions downgraded the way
  # forks do, so the boundary has to be drawn here rather than assumed.

  dependency-graph:
    # Pull requests: prove resolution still works, with a read-only token and no submission.
    name: Dependency graph
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gradle-dependency-graph
        with:
          mode: generate-and-upload

  dependency-graph-submit:
    # main: without this, Dependabot reports zero alerts here and the silence means nothing.
    # On 22.08.2026 the graph held 237 npm packages from worker/, nine actions and no JVM
    # entry at all, eight days after the app moved into this repository -- GitHub does not
    # derive a Gradle graph on its own. The code being run here is already merged, so the
    # write token is at the same trust level as the rest of the push build.
    name: Dependency graph (submit)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gradle-dependency-graph
        with:
          mode: generate-and-submit
