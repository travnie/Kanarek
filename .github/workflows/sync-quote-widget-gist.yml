name: Sync quote widget gist

on:
  push:
    branches:
      - feat/quote-widget
    paths:
      - .github/workflows/sync-quote-widget-gist.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/quote-widget
      - name: Bundle quote snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          curl --fail --location --retry 3 \
            https://gist.githubusercontent.com/trvny/167d2271e3cf7d21e118aa7d906a7d2c/raw/quotes.json \
            -o app/src/main/res/raw/quotes.json
          python -m json.tool app/src/main/res/raw/quotes.json >/dev/null
      - name: Commit snapshot
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/res/raw/quotes.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/raw/quotes.json
          git commit -m "chore(widget): bundle quote snapshot"
          git push origin HEAD:feat/quote-widget
